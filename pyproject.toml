[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-toppings"
version = "0.1.0"
description = "Build a pizza empire. Run the city's underground market. Keep the books believable."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# Pinned so "ruff clean" means the same thing on every machine — 0.16
# already enables new findings. Bump deliberately, with the fix commit.
dev = ["ruff>=0.15,<0.16", "mypy>=1.8"]

[project.scripts]
extra-toppings = "extra_toppings.__main__:main"

[tool.setuptools.packages.find]
include = ["extra_toppings*"]
